[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oniscrape"
version = "0.2.3"
description = "High-performance async scraping engine powered by curl_cffi, selectolax, orjson, and Pydantic v2. Extracts Next.js SSR, RSC Flight streams, and Meta Relay states without headless browsers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OniSku" }
]
keywords = [
    "scraper",
    "crawler",
    "curl-cffi",
    "selectolax",
    "pydantic",
    "react-server-components",
    "nextjs",
    "rsc",
    "tls-fingerprint",
    "ja3",
    "anti-bot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "curl_cffi>=0.7.4",
    "selectolax>=0.3.21",
    "pydantic>=2.7.0",
    "orjson>=3.10.0",
    "jmespath>=1.0.1",
    "tenacity>=8.3.0",
]

[project.urls]
Homepage = "https://github.com/OniSku/oniscrape"
Repository = "https://github.com/OniSku/oniscrape"
Issues = "https://github.com/OniSku/oniscrape/issues"
Documentation = "https://github.com/OniSku/oniscrape#readme"
Examples = "https://github.com/OniSku/oniscrape/tree/main/examples"

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oniscrape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
